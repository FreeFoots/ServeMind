[package]
name = "servemind"
version = "0.1.0"
description = "ServeMind macOS desktop shell"
edition = "2021"

[lib]
name = "servemind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
