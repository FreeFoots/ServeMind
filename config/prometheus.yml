global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: servemind
    metrics_path: /metrics
    static_configs:
      - targets: [api:8317]
    # With MONITOR_TOKEN enabled, mount a secret and use authorization.credentials_file.
