worker_processes auto;
events { worker_connections 1024; }
http {
    # No URL query strings or message bodies in access logs.
    log_format safe '$time_iso8601 $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log safe;
    upstream backend { server api:8317; keepalive 32; }
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connection_limit:10m;
    server {
        listen 8080;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        location = /metrics { deny all; }
        location = /v1/operations { deny all; }
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn connection_limit 10;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
        }
    }
}
